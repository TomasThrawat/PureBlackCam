name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Package zip
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/PureBlackCam-debug.apk
          cd out
          zip PureBlackCam-debug.zip PureBlackCam-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureBlackCam-apk
          path: out/PureBlackCam-debug.zip
          retention-days: 30

      - name: Create GitHub Release with APK zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Pure Black Cam - build ${{ github.run_number }}"
          files: out/PureBlackCam-debug.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
